---
networks:
  vpn_network:
    driver: bridge
services:
  surfshark:
    container_name: surfshark
    image: qmcgaw/gluetun
    cap_add:
      - NET_ADMIN
    ports:
      - 8080:8080
      # Note: Surfshark does not support port forwarding; additional torrent ports are not useful for inbound peers
    environment:
      - VPN_SERVICE_PROVIDER=surfshark
      - OPENVPN_USER=${OPENVPN_USER}
      - OPENVPN_PASSWORD=${OPENVPN_PASSWORD}
      - SERVER_COUNTRIES=${SERVER_COUNTRIES}
      - SERVER_HOSTNAMES=${SERVER_HOSTNAMES}
      - VPN_TYPE=openvpn
    networks:
      - vpn_network
    restart: always
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    network_mode: service:surfshark
    container_name: qbittorrent
    depends_on:
      - surfshark
    environment:
      - WEBUI_PORT=8080
      - PUID=0
      - PGID=0
      - TZ=${TZ}
      #- DOCKER_MODS=ghcr.io/gabe565/linuxserver-mod-vuetorrent
    volumes:
      - ${DOWNLOADS_PATH}:/downloads
      - ${CONFIGS_PATH}/qbittorrent:/config
    restart: unless-stopped
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LOG_HTML=${LOG_HTML:-false}
      - CAPTCHA_SOLVER=${CAPTCHA_SOLVER:-none}
      - TZ=${TZ}
      - LANG=en_US
    ports:
      - 8191:8191
    networks:
      - vpn_network
    restart: unless-stopped
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      - PUID=0
      - PGID=0
      - TZ=${TZ}
    volumes:
      - ${CONFIGS_PATH}/prowlarr:/config
    ports:
      - 9696:9696
    networks:
      - vpn_network
    restart: unless-stopped
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=0
      - PGID=0
      - TZ=${TZ}
    volumes:
      - ${TV_SHOWS_PATH}:/tv
      - ${DOWNLOADS_PATH}:/downloads
      - ${CONFIGS_PATH}/sonarr:/config
    ports:
      - 8989:8989
    networks:
      - vpn_network
    restart: unless-stopped
  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      - PUID=0
      - PGID=0
      - TZ=${TZ}
    volumes:
      - ${MOVIES_PATH}:/movies
      - ${DOWNLOADS_PATH}:/downloads
      - ${CONFIGS_PATH}/radarr:/config
    ports:
      - 7878:7878
    networks:
      - vpn_network
    restart: unless-stopped
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    environment:
      - PUID=0
      - PGID=0
      - TZ=${TZ}
    ports:
      - 8096:8096
      - 8920:8920
      - 7359:7359/udp
      - 1900:1900/udp
    volumes:
      - ${TV_SHOWS_PATH}:/data/tvshows
      - ${MOVIES_PATH}:/data/movies
      - ${COLD_MOVIES_PATH}:/data/cold/movies
      - ${COLD_TV_SHOWS_PATH}:/data/cold/tvshows
      - ${BOOKS_PATH}:/data/books
      - ${CONFIGS_PATH}/jellyfin:/config
      - ${JELLYFIN_CACHE_PATH}:/cache
    networks:
      - vpn_network
    restart: unless-stopped
  filebrowser:
    image: filebrowser/filebrowser:latest
    container_name: filebrowser
    user: "0:0"
    environment:
      - TZ=${TZ}
    command: -d /config/database.db -r /srv
    ports:
      - 8081:80
    volumes:
      - ${TV_SHOWS_PATH}:/srv/tvshows
      - ${MOVIES_PATH}:/srv/movies
      - ${COLD_MOVIES_PATH}:/srv/cold/movies
      - ${COLD_TV_SHOWS_PATH}:/srv/cold/tvshows
      - ${BOOKS_PATH}:/srv/books
      - ${CONFIGS_PATH}/filebrowser:/config
    networks:
      - vpn_network
    restart: unless-stopped
  jellyseerr:
    image: fallenbagel/jellyseerr:latest
    container_name: jellyseerr
    environment:
      - LOG_LEVEL=debug
      - TZ=${TZ}
    ports:
      - 5055:5055
    volumes:
      - ${CONFIGS_PATH}/jellyseerr:/app/config
      - ${TV_SHOWS_PATH}:/data/tvshows
      - ${MOVIES_PATH}:/data/movies
      - ${COLD_MOVIES_PATH}:/data/cold/movies
      - ${COLD_TV_SHOWS_PATH}:/data/cold/tvshows
      - ${BOOKS_PATH}:/data/books
    networks:
      - vpn_network
    restart: unless-stopped
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    environment:
      - HOMEPAGE_ALLOWED_HOSTS=*
      - PUID=0
      - PGID=0
      - TZ=${TZ}
      - HOMEPAGE_VAR_JELLYFIN_API_KEY=${HOMEPAGE_VAR_JELLYFIN_API_KEY}
      - HOMEPAGE_VAR_SONARR_API_KEY=${HOMEPAGE_VAR_SONARR_API_KEY}
      - HOMEPAGE_VAR_RADARR_API_KEY=${HOMEPAGE_VAR_RADARR_API_KEY}
      - HOMEPAGE_VAR_PROWLARR_API_KEY=${HOMEPAGE_VAR_PROWLARR_API_KEY}
      - HOMEPAGE_VAR_QBITTORRENT_PASSWORD=${HOMEPAGE_VAR_QBITTORRENT_PASSWORD}
      - HOMEPAGE_VAR_JELLYSEERR_API_KEY=${HOMEPAGE_VAR_JELLYSEERR_API_KEY}
      - HOMEPAGE_VAR_SABNZBD_API_KEY=${HOMEPAGE_VAR_SABNZBD_API_KEY}
    ports:
      - 3000:3000
    volumes:
      - ${CONFIGS_PATH}/homepage:/app/config
      - ${CONFIGS_PATH}/homepage/images:/app/public/images
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - vpn_network
    restart: unless-stopped
  sabnzbd:
    image: lscr.io/linuxserver/sabnzbd:latest
    container_name: sabnzbd
    environment:
      - PUID=0
      - PGID=0
      - TZ=${TZ}
    volumes:
      - ${DOWNLOADS_PATH}:/downloads
      - ${CONFIGS_PATH}/sabnzbd:/config
    ports:
      - 8082:8080 # Host port 8082 for SABnzbd WebUI
    networks:
      - vpn_network
    restart: unless-stopped