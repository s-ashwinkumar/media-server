---
networks:
  vpn_network:
    driver: bridge
services:
  traefik:
    # v3.6+ is required for Docker API >= 1.44 (Docker 29+)
    image: traefik:latest
    container_name: traefik
    environment:
      # Your Docker daemon requires API >= 1.44. Without this, Traefik's Docker
      # provider fails and no routers/services show up in the dashboard.
      - DOCKER_API_VERSION=1.44
    command:
      - "--api.dashboard=true"
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--log.level=INFO"
    ports:
      - "80:80"
      - "8083:8080" # Traefik dashboard (accessible via http://traefik.local or http://your-tailscale-ip:8083)
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${CONFIGS_PATH}/traefik:/etc/traefik
    networks:
      - vpn_network
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik.rule=Host(`traefik.${TRAEFIK_DOMAIN:-local}`)"
      - "traefik.http.routers.traefik.entrypoints=web"
      - "traefik.http.routers.traefik.service=api@internal"
  surfshark:
    container_name: surfshark
    image: qmcgaw/gluetun
    cap_add:
      - NET_ADMIN
    ports:
      - 8080:8080
      # Note: Surfshark does not support port forwarding; additional torrent ports are not useful for inbound peers
    environment:
      - VPN_SERVICE_PROVIDER=surfshark
      - OPENVPN_USER=${OPENVPN_USER}
      - OPENVPN_PASSWORD=${OPENVPN_PASSWORD}
      - SERVER_COUNTRIES=${SERVER_COUNTRIES}
      - SERVER_HOSTNAMES=${SERVER_HOSTNAMES}
      - VPN_TYPE=openvpn
    volumes:
      - ${CONFIGS_PATH}/gluetun/config.toml:/gluetun/auth/config.toml:ro
    networks:
      - vpn_network
    restart: always
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.qbittorrent.rule=Host(`qbittorrent.${TRAEFIK_DOMAIN:-local}`)"
      - "traefik.http.routers.qbittorrent.entrypoints=web"
      - "traefik.http.services.qbittorrent.loadbalancer.server.port=8080"
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    network_mode: service:surfshark
    container_name: qbittorrent
    depends_on:
      - surfshark
    environment:
      - WEBUI_PORT=8080
      - PUID=0
      - PGID=0
      - TZ=${TZ}
      #- DOCKER_MODS=ghcr.io/gabe565/linuxserver-mod-vuetorrent
    volumes:
      - ${DOWNLOADS_PATH}:/downloads
      - ${CONFIGS_PATH}/qbittorrent:/config
    restart: unless-stopped
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LOG_HTML=${LOG_HTML:-false}
      - CAPTCHA_SOLVER=${CAPTCHA_SOLVER:-none}
      - TZ=${TZ}
      - LANG=en_US
    ports:
      - 8191:8191
    networks:
      - vpn_network
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.flaresolverr.rule=Host(`flaresolverr.${TRAEFIK_DOMAIN:-local}`)"
      - "traefik.http.routers.flaresolverr.entrypoints=web"
      - "traefik.http.services.flaresolverr.loadbalancer.server.port=8191"
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      - PUID=0
      - PGID=0
      - TZ=${TZ}
    volumes:
      - ${CONFIGS_PATH}/prowlarr:/config
    ports:
      - 9696:9696
    networks:
      - vpn_network
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.prowlarr.rule=Host(`prowlarr.${TRAEFIK_DOMAIN:-local}`)"
      - "traefik.http.routers.prowlarr.entrypoints=web"
      - "traefik.http.services.prowlarr.loadbalancer.server.port=9696"
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=0
      - PGID=0
      - TZ=${TZ}
    volumes:
      - ${TV_SHOWS_PATH}:/tv
      - ${DOWNLOADS_PATH}:/downloads
      - ${CONFIGS_PATH}/sonarr:/config
    ports:
      - 8989:8989
    networks:
      - vpn_network
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.sonarr.rule=Host(`sonarr.${TRAEFIK_DOMAIN:-local}`)"
      - "traefik.http.routers.sonarr.entrypoints=web"
      - "traefik.http.services.sonarr.loadbalancer.server.port=8989"
  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      - PUID=0
      - PGID=0
      - TZ=${TZ}
    volumes:
      - ${MOVIES_PATH}:/movies
      - ${DOWNLOADS_PATH}:/downloads
      - ${CONFIGS_PATH}/radarr:/config
    ports:
      - 7878:7878
    networks:
      - vpn_network
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.radarr.rule=Host(`radarr.${TRAEFIK_DOMAIN:-local}`)"
      - "traefik.http.routers.radarr.entrypoints=web"
      - "traefik.http.services.radarr.loadbalancer.server.port=7878"
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    environment:
      - PUID=0
      - PGID=0
      - TZ=${TZ}
    ports:
      - 8096:8096
      - 8920:8920
      - 7359:7359/udp
      - 1900:1900/udp
    volumes:
      - ${TV_SHOWS_PATH}:/data/tvshows
      - ${MOVIES_PATH}:/data/movies
      - ${COLD_MOVIES_PATH}:/data/cold/movies
      - ${COLD_TV_SHOWS_PATH}:/data/cold/tvshows
      - ${BOOKS_PATH}:/data/books
      - ${CONFIGS_PATH}/jellyfin:/config
      - ${JELLYFIN_CACHE_PATH}:/cache
    networks:
      - vpn_network
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.jellyfin.rule=Host(`jellyfin.${TRAEFIK_DOMAIN:-local}`)"
      - "traefik.http.routers.jellyfin.entrypoints=web"
      - "traefik.http.services.jellyfin.loadbalancer.server.port=8096"
    devices:
      - /dev/dri/renderD128:/dev/dri/renderD128
      - /dev/dri/card1:/dev/dri/card1  
  filebrowser:
    image: filebrowser/filebrowser:latest
    container_name: filebrowser
    user: "0:0"
    environment:
      - TZ=${TZ}
    command: -d /config/database.db -r /srv
    ports:
      - 8081:80
    volumes:
      - ${TV_SHOWS_PATH}:/srv/tvshows
      - ${MOVIES_PATH}:/srv/movies
      - ${COLD_MOVIES_PATH}:/srv/cold/movies
      - ${COLD_TV_SHOWS_PATH}:/srv/cold/tvshows
      - ${BOOKS_PATH}:/srv/books
      - ${CONFIGS_PATH}/filebrowser:/config
    networks:
      - vpn_network
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.filebrowser.rule=Host(`filebrowser.${TRAEFIK_DOMAIN:-local}`)"
      - "traefik.http.routers.filebrowser.entrypoints=web"
      - "traefik.http.services.filebrowser.loadbalancer.server.port=80"
  jellyseerr:
    image: ghcr.io/seerr-team/seerr:latest
    container_name: jellyseerr
    init: true
    environment:
      - LOG_LEVEL=debug
      - TZ=${TZ}
    ports:
      - 5055:5055
    volumes:
      - ${CONFIGS_PATH}/jellyseerr:/app/config
    networks:
      - vpn_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5055/api/v1/status"]
      start_period: 20s
      interval: 15s
      timeout: 3s
      retries: 3
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.jellyseerr.rule=Host(`jellyseerr.${TRAEFIK_DOMAIN:-local}`)"
      - "traefik.http.routers.jellyseerr.entrypoints=web"
      - "traefik.http.services.jellyseerr.loadbalancer.server.port=5055"
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    environment:
      - HOMEPAGE_ALLOWED_HOSTS=*
      - PUID=0
      - PGID=0
      - TZ=${TZ}
      - HOMEPAGE_VAR_JELLYFIN_API_KEY=${HOMEPAGE_VAR_JELLYFIN_API_KEY}
      - HOMEPAGE_VAR_SONARR_API_KEY=${HOMEPAGE_VAR_SONARR_API_KEY}
      - HOMEPAGE_VAR_RADARR_API_KEY=${HOMEPAGE_VAR_RADARR_API_KEY}
      - HOMEPAGE_VAR_PROWLARR_API_KEY=${HOMEPAGE_VAR_PROWLARR_API_KEY}
      - HOMEPAGE_VAR_QBITTORRENT_PASSWORD=${HOMEPAGE_VAR_QBITTORRENT_PASSWORD}
      - HOMEPAGE_VAR_JELLYSEERR_API_KEY=${HOMEPAGE_VAR_JELLYSEERR_API_KEY}
      - HOMEPAGE_VAR_SABNZBD_API_KEY=${HOMEPAGE_VAR_SABNZBD_API_KEY}
      - HOMEPAGE_VAR_BAZARR_API_KEY=${HOMEPAGE_VAR_BAZARR_API_KEY}
    ports:
      - 3000:3000
    volumes:
      - ${CONFIGS_PATH}/homepage:/app/config
      - ${CONFIGS_PATH}/homepage/images:/app/public/images
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - vpn_network
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.homepage.rule=Host(`homepage.${TRAEFIK_DOMAIN:-local}`)"
      - "traefik.http.routers.homepage.entrypoints=web"
      - "traefik.http.services.homepage.loadbalancer.server.port=3000"
  sabnzbd:
    image: lscr.io/linuxserver/sabnzbd:latest
    container_name: sabnzbd
    environment:
      - PUID=0
      - PGID=0
      - TZ=${TZ}
    volumes:
      - ${DOWNLOADS_PATH}:/downloads
      - ${CONFIGS_PATH}/sabnzbd:/config
    ports:
      - 8082:8080 # Host port 8082 for SABnzbd WebUI
    networks:
      - vpn_network
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.sabnzbd.rule=Host(`sabnzbd.${TRAEFIK_DOMAIN:-local}`)"
      - "traefik.http.routers.sabnzbd.entrypoints=web"
      - "traefik.http.services.sabnzbd.loadbalancer.server.port=8080"
  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    environment:
      - PUID=0
      - PGID=0
      - TZ=${TZ}
    volumes:
      - ${CONFIGS_PATH}/bazarr:/config
      # Mount TV and Movie paths using the same internal names as Sonarr/Radarr
      - ${TV_SHOWS_PATH}:/tv
      - ${MOVIES_PATH}:/movies
      # Mount cold storage paths so Bazarr can find subtitles for ALL media
      - ${COLD_TV_SHOWS_PATH}:/coldtv
      - ${COLD_MOVIES_PATH}:/coldmovies
    ports:
      - 6767:6767 # Host Port 6767 for WebUI, Container Port 6767
    networks:
      - vpn_network
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.bazarr.rule=Host(`bazarr.${TRAEFIK_DOMAIN:-local}`)"
      - "traefik.http.routers.bazarr.entrypoints=web"
      - "traefik.http.services.bazarr.loadbalancer.server.port=6767"

  audiobookshelf:
    image: ghcr.io/advplyr/audiobookshelf:latest
    container_name: audiobookshelf
    environment:
      - TZ=${TZ}
      - AUDIOBOOKSHELF_TYPE=multi-user
    ports:
      - 13378:80
    volumes:
      - ${BOOKS_PATH}:/audiobooks
      - ${BOOKS_PATH}:/books
      - ${CONFIGS_PATH}/audiobookshelf/config:/config
      - ${CONFIGS_PATH}/audiobookshelf/metadata:/metadata
    networks:
      - vpn_network
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.audiobookshelf.rule=Host(`audiobookshelf.${TRAEFIK_DOMAIN:-local}`)"
      - "traefik.http.routers.audiobookshelf.entrypoints=web"
      - "traefik.http.services.audiobookshelf.loadbalancer.server.port=80"

  lazylibrarian:
    image: lscr.io/linuxserver/lazylibrarian:latest
    container_name: lazylibrarian
    environment:
      - PUID=0
      - PGID=0
      - TZ=${TZ}
    ports:
      - 5299:5299
    volumes:
      - ${BOOKS_PATH}:/books
      - ${DOWNLOADS_PATH}:/downloads
      - ${CONFIGS_PATH}/lazylibrarian:/config
    networks:
      - vpn_network
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.lazylibrarian.rule=Host(`lazylibrarian.${TRAEFIK_DOMAIN:-local}`)"
      - "traefik.http.routers.lazylibrarian.entrypoints=web"
      - "traefik.http.services.lazylibrarian.loadbalancer.server.port=5299"